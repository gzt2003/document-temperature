services:
  collector:
    build: .
    container_name: temperature-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.json
      DATA_DIR: /data
      TZ: Asia/Shanghai
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/data
    shm_size: 512m
    mem_limit: 2500m
    cpus: 2.0


